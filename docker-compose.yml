services:
  jira-mcp:
    build:
      context: .
      dockerfile: Dockerfile.jira-mcp
    container_name: jira-mcp
    ports:
      - "8000:8000"
    env_file:
      - jira.env
    command: ["--transport", "sse", "--port", "8000"]
    restart: unless-stopped
    networks:
      - compliance-net

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - compliance-net

  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compliance-dashboard
    ports:
      - "5000:5000"
    env_file:
      - jira.env
    environment:
      - MCP_SERVER_URL=http://jira-mcp:8000/sse
      - OLLAMA_URL=http://ollama:11434/v1/chat/completions
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-15}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
    volumes:
      - compliance-data:/app/data
    depends_on:
      - jira-mcp
      - ollama
    restart: unless-stopped
    networks:
      - compliance-net

networks:
  compliance-net:
    driver: bridge

volumes:
  ollama-data:
  compliance-data:
