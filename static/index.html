<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jira MCP Test UI</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
  fieldset { margin-bottom: 24px; padding: 16px; }
  label { display: block; margin-top: 8px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; }
  button { margin-top: 10px; padding: 8px 14px; }
  pre { background: #1e1e1e; color: #d4d4d4; padding: 14px; white-space: pre-wrap;
        word-break: break-word; border-radius: 6px; font-size: 13px; line-height: 1.5;
        max-height: 500px; overflow-y: auto; }
  .json-key { color: #9cdcfe; }
  .json-string { color: #ce9178; }
  .json-number { color: #b5cea8; }
  .json-boolean { color: #569cd6; }
  .json-null { color: #808080; }
  .block-label { display: inline-block; background: #444; color: #fff; font-size: 11px;
                 padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }
  .error-banner { background: #fdecea; color: #611a15; padding: 10px 14px; border-radius: 6px;
                  margin-bottom: 10px; border: 1px solid #f5c6cb; }
</style>
</head>
<body>
<h1>Jira MCP Test UI</h1>

<fieldset>
  <legend>List available MCP tools</legend>
  <button onclick="listTools()">Fetch tools</button>
</fieldset>

<fieldset>
  <legend>Get Issue</legend>
  <label>Issue key <input id="getKey" placeholder="PROJ-123"></label>
  <button onclick="getIssue()">Get</button>
</fieldset>

<fieldset>
  <legend>Search (JQL)</legend>
  <label>JQL <input id="jql" placeholder="project = PROJ ORDER BY created DESC"></label>
  <button onclick="search()">Search</button>
</fieldset>

<fieldset>
  <legend>Create Issue</legend>
  <label>Project key <input id="projectKey" placeholder="PROJ"></label>
  <label>Summary <input id="summary"></label>
  <label>Issue type <input id="issueType" placeholder="Task"></label>
  <label>Description <textarea id="description"></textarea></label>
  <button onclick="createIssue()">Create</button>
</fieldset>

<fieldset>
  <legend>Add Comment</legend>
  <label>Issue key <input id="commentKey" placeholder="PROJ-123"></label>
  <label>Comment <textarea id="commentBody"></textarea></label>
  <button onclick="addComment()">Add comment</button>
</fieldset>

<h3>Result</h3>
<div id="out">-</div>

<script>
// Syntax-highlight a JSON string for display inside a <pre> (as HTML)
function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return json.replace(
    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    (match) => {
      let cls = 'json-number';
      if (/^"/.test(match)) {
        cls = /:$/.test(match) ? 'json-key' : 'json-string';
      } else if (/true|false/.test(match)) {
        cls = 'json-boolean';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return `<span class="${cls}">${match}</span>`;
    }
  );
}

// MCP tool results come back as an array of content blocks, e.g.
// [{ type: "text", text: "<json or plain string>" }, ...]
// This unwraps each block and tries to parse its "text" as JSON so it
// renders as structured, indented, colorized output instead of one
// giant escaped string.
function render(data) {
  const out = document.getElementById('out');
  out.innerHTML = '';

  // Flask-side error (e.g. { error: "..." })
  if (data && !Array.isArray(data) && data.error) {
    const banner = document.createElement('div');
    banner.className = 'error-banner';
    banner.textContent = data.error;
    out.appendChild(banner);
    return;
  }

  // Not an array of MCP content blocks — just pretty-print as-is
  if (!Array.isArray(data)) {
    const pre = document.createElement('pre');
    pre.innerHTML = syntaxHighlight(data);
    out.appendChild(pre);
    return;
  }

  data.forEach((block, i) => {
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = `block ${i + 1} · ${block.type || 'unknown'}`;
    out.appendChild(label);

    const pre = document.createElement('pre');
    let content = block.text !== undefined ? block.text : block;

    // block.text is usually a plain string that MIGHT itself be JSON
    // (mcp-atlassian returns JSON-as-text for search/get results, or
    // a plain error message for failures). Try to parse; fall back to
    // showing the raw text if it isn't valid JSON.
    if (typeof content === 'string') {
      try {
        const parsed = JSON.parse(content);
        pre.innerHTML = syntaxHighlight(parsed);
      } catch (e) {
        pre.textContent = content; // plain error/message text
      }
    } else {
      pre.innerHTML = syntaxHighlight(content);
    }
    out.appendChild(pre);
  });
}

// Kept for compatibility; now delegates to the readable renderer
function show(data) { render(data); }

async function listTools() {
  const r = await fetch('/api/tools');
  show(await r.json());
}

async function getIssue() {
  const key = document.getElementById('getKey').value;
  const r = await fetch(`/api/issues/${key}`);
  show(await r.json());
}

async function search() {
  const jql = document.getElementById('jql').value;
  const r = await fetch(`/api/search?jql=${encodeURIComponent(jql)}`);
  show(await r.json());
}

async function createIssue() {
  const body = {
    project_key: document.getElementById('projectKey').value,
    summary: document.getElementById('summary').value,
    issue_type: document.getElementById('issueType').value,
    description: document.getElementById('description').value,
  };
  const r = await fetch('/api/issues', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  show(await r.json());
}

async function addComment() {
  const key = document.getElementById('commentKey').value;
  const body = { comment: document.getElementById('commentBody').value };
  const r = await fetch(`/api/issues/${key}/comment`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  show(await r.json());
}
</script>
</body>
</html>
