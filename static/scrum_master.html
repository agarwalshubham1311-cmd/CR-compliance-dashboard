<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scrum Master View</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  body { font-family: arial, sans-serif; max-width: 1150px; margin: 0 auto 30px; padding: 0 16px; color: #0b0c0c; font-size: 16px; }
  .toolbar { background: #0b0c0c; padding: 14px 20px; margin: 0 -16px 20px; display: flex; justify-content: space-between; align-items: center; }
  .toolbar span.title { color: #fff; font-weight: 700; font-size: 18px; }
  .toolbar a { color: #fff; font-size: 13px; text-decoration: underline; }
  .toolbar input { font-size: 13px; padding: 6px 10px; border: none; width: 220px; }
  #status { color: #b1b4b6; font-size: 13px; }

  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: #b1b4b6; margin-bottom: 20px; }
  .card { background: #fff; padding: 14px; }
  .card p.label { font-size: 12px; color: #505a5f; margin: 0; }
  .card p.value { font-size: 26px; font-weight: 700; margin: 4px 0 0; }
  .card p.value.danger { color: #d4351c; }
  .card p.value.warning { color: #7b4416; }
  .card p.value.ok { color: #00703c; }

  .panel { background: #fff; border: 1px solid #b1b4b6; padding: 16px 18px; margin-bottom: 16px; }
  .panel p.heading { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
  .panel p.subheading { font-size: 12px; color: #505a5f; margin: -8px 0 10px; }
  .row { display: flex; gap: 16px; }
  .row > .panel { flex: 1; }

  .heatmap-grid { display: grid; gap: 4px; font-size: 12px; }
  .heatmap-grid .cell { text-align: center; padding: 6px; }
  .heatmap-grid .rowlabel { color: #505a5f; padding: 6px 8px 6px 0; }
  .heatmap-grid .collabel { text-align: center; color: #505a5f; }

  .blocker-row, .lb-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .bar-track { flex: 1; background: #f3f2f1; height: 8px; margin: 0 10px; }
  .bar-fill { height: 8px; }

  .empty { color: #505a5f; font-size: 13px; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="title">Scrum Master view</span>
  <div style="display:flex; gap:14px; align-items:center;">
    <span id="status"></span>
    <a href="/dashboard">Compliance dashboard &#8594;</a>
  </div>
</div>

<div class="cards" id="cards"></div>

<div class="panel">
  <p class="heading">Risk by team</p>
  <p class="subheading">Count of at-risk items per team, by severity</p>
  <div id="heatmap"></div>
</div>

<div class="row">
  <div class="panel">
    <p class="heading">Blocked items</p>
    <p class="subheading" id="blockerSub"></p>
    <div id="blockers"></div>
  </div>
  <div class="panel">
    <p class="heading">Governance leaderboard</p>
    <p class="subheading">Compliance rate by team, current scan</p>
    <div id="leaderboard"></div>
  </div>
</div>

<div class="cards" id="capacityCards"></div>

<div class="panel">
  <p class="heading">Team capacity</p>
  <p class="subheading" id="capacitySub"></p>
  <div id="capacityTable"></div>
</div>

<script>
async function load() {
  const r = await fetch('/api/scrum-master/overview');
  const d = await r.json();

  document.getElementById('status').textContent = 'Loaded just now';

  const rate = d.compliance_rate;
  document.getElementById('cards').innerHTML = `
    <div class="card"><p class="label">Tracked items</p><p class="value">${d.tracked_items}</p></div>
    <div class="card"><p class="label">At risk</p><p class="value danger">${d.at_risk}</p></div>
    <div class="card"><p class="label">Blocked</p><p class="value danger">${d.blocked}</p></div>
    <div class="card"><p class="label">Stale &gt;${d.stale_threshold_days}d</p><p class="value warning">${d.stale}</p></div>
    <div class="card"><p class="label">Compliance</p><p class="value ${rate !== null && rate >= 70 ? 'ok' : 'warning'}">${rate === null ? '-' : rate + '%'}</p></div>
  `;

  const teams = Object.keys(d.heatmap);
  const sevCols = ['Low', 'Medium', 'High', 'Critical'];
  const sevBg = { Low: '#f3f2f1', Medium: '#faeeda', High: '#fcebeb', Critical: '#f7dede' };
  if (teams.length === 0) {
    document.getElementById('heatmap').innerHTML = '<p class="empty">No team-attributed risk data yet.</p>';
  } else {
    let html = `<div class="heatmap-grid" style="grid-template-columns:110px repeat(${sevCols.length},1fr);">`;
    html += '<div></div>' + sevCols.map(s => `<div class="collabel">${s}</div>`).join('');
    teams.forEach(team => {
      html += `<div class="rowlabel">${team}</div>`;
      sevCols.forEach(s => {
        const count = d.heatmap[team][s] || 0;
        html += `<div class="cell" style="background:${sevBg[s]};font-weight:${count > 0 ? 700 : 400};">${count}</div>`;
      });
    });
    html += '</div>';
    document.getElementById('heatmap').innerHTML = html;
  }

  const blockerTypes = Object.entries(d.top_blockers_by_type);
  document.getElementById('blockerSub').textContent = `${d.blocked} blocked across all types`;
  if (blockerTypes.length === 0) {
    document.getElementById('blockers').innerHTML = '<p class="empty">Nothing currently blocked.</p>';
  } else {
    document.getElementById('blockers').innerHTML = blockerTypes
      .sort((a, b) => b[1] - a[1])
      .map(([type, count]) => `<div class="blocker-row"><span>${type}</span><strong>${count}</strong></div>`)
      .join('');
  }

  if (d.leaderboard.length === 0) {
    document.getElementById('leaderboard').innerHTML = '<p class="empty">No team-attributed compliance data yet.</p>';
  } else {
    const max = Math.max(...d.leaderboard.map(t => t.compliance_rate), 1);
    document.getElementById('leaderboard').innerHTML = d.leaderboard.map(t => `
      <div class="lb-row">
        <span style="width:110px;">${t.team}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(t.compliance_rate / max) * 100}%; background:${t.compliance_rate >= 70 ? '#00703c' : '#f47738'};"></div></div>
        <span>${t.compliance_rate}%</span>
      </div>
    `).join('');
  }
}

async function loadCapacity() {
  const r = await fetch('/api/scrum-master/capacity');
  const d = await r.json();

  document.getElementById('capacityCards').innerHTML = `
    <div class="card"><p class="label">Total WIP</p><p class="value">${d.total_wip}</p></div>
    <div class="card"><p class="label">Avg per person</p><p class="value">${d.avg_wip_per_person}</p></div>
    <div class="card"><p class="label">Over capacity</p><p class="value warning">${d.people_over_capacity} ${d.people_over_capacity === 1 ? 'person' : 'people'}</p></div>
    <div class="card"><p class="label">Blocked, needs help</p><p class="value danger">${d.blocked_items_total} items</p></div>
  `;

  document.getElementById('capacitySub').textContent = 'Sorted by who might benefit from a check-in - not a ranking';

  if (d.people.length === 0) {
    document.getElementById('capacityTable').innerHTML = '<p class="empty">No assignee data yet - trigger a scan first.</p>';
    return;
  }

  let html = '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
  html += `<tr style="border-bottom:1px solid #0b0c0c;">
    <td style="padding:8px 0;font-weight:700;">Person</td>
    <td style="padding:8px 0;font-weight:700;text-align:center;">WIP</td>
    <td style="padding:8px 0;font-weight:700;text-align:center;">Blocked</td>
    <td style="padding:8px 0;font-weight:700;text-align:center;">Stale</td>
    <td style="padding:8px 0;font-weight:700;text-align:center;">Critical/High</td>
    <td style="padding:8px 0;font-weight:700;"></td>
  </tr>`;
  d.people.forEach(p => {
    html += `<tr style="border-bottom:1px solid #b1b4b6;">
      <td style="padding:10px 0;">${p.assignee}${p.team ? ` <span style="color:#505a5f;font-size:11px;">(${p.team})</span>` : ''}</td>
      <td style="padding:10px 0;text-align:center;">${p.wip}</td>
      <td style="padding:10px 0;text-align:center;${p.blocked >= 3 ? 'color:#942514;font-weight:700;' : ''}">${p.blocked}</td>
      <td style="padding:10px 0;text-align:center;${p.stale >= 2 ? 'color:#7b4416;font-weight:700;' : ''}">${p.stale}</td>
      <td style="padding:10px 0;text-align:center;">${p.critical_high}</td>
      <td style="padding:10px 0;">${p.flagged ? '<span style="background:#f3f2f1;font-size:11px;font-weight:700;padding:3px 8px;">Worth a check-in</span>' : ''}</td>
    </tr>`;
  });
  html += '</table>';
  document.getElementById('capacityTable').innerHTML = html;
}

load();
loadCapacity();
</script>

</body>
</html>
